<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2a63"><link rel="icon" id="fav">
<title>ERP Engineering — PT Murinda Sentra Baja</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f3f6fc;--ink:#1e293b;--mut:#64748b;--line:#e3e9f4;--p:#6366f1;--glass:rgba(255,255,255,.72);--sp:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden}
button,select,input{font:inherit}
.rip{position:relative;overflow:hidden;cursor:pointer}
.rip .r{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none}
.nav .r,.pg .r{background:rgba(99,102,241,.25)}
@keyframes rp{to{transform:scale(4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.15)}}
@keyframes rise{0%{transform:translateY(105vh) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(-15vh) rotate(360deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes shim{to{background-position:-200% 0}}
/* LOADER */
#load{position:fixed;inset:0;z-index:99;display:none;place-items:center;background:rgba(243,246,252,.86);backdrop-filter:blur(14px)}
#load.on{display:grid;animation:up .3s}
.lw{text-align:center}.ld{position:relative;width:130px;height:130px;margin:0 auto 22px}
.ld .a,.ld .b{position:absolute;border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px))}
.ld .a{inset:0;background:conic-gradient(#6366f1,#06b6d4,#22c55e,#f59e0b,#ef4444,#6366f1);animation:spin 1.3s linear infinite}
.ld .b{inset:18px;background:conic-gradient(#ec4899,#f59e0b,#06b6d4,#ec4899);animation:spin 1.9s linear infinite reverse}
.ld .c{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;animation:spin 4s linear infinite;filter:drop-shadow(0 0 12px rgba(99,102,241,.6))}
.ld .s{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;border-radius:50%;background:#f59e0b;box-shadow:0 0 10px 3px #fbbf24;animation:orb 1.6s linear infinite}
@keyframes orb{from{transform:rotate(var(--a)) translateX(72px) scale(1)}50%{transform:rotate(calc(var(--a) + 180deg)) translateX(78px) scale(.4)}to{transform:rotate(calc(var(--a) + 360deg)) translateX(72px) scale(1)}}
.lb{width:230px;height:5px;border-radius:9px;background:#e2e8f0;margin:0 auto 12px;overflow:hidden}
.lb i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#06b6d4,#22c55e,#6366f1);background-size:200% 100%;animation:shim 1.1s linear infinite;width:100%}
#lmsg{font-weight:600;color:var(--mut);font-size:13px;letter-spacing:.3px}
/* LOGIN */
#login{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#eef2ff,#ecfeff 50%,#fff7ed);overflow:hidden;z-index:50;perspective:900px}
.bl{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 14s ease-in-out infinite}
.fl{position:absolute;bottom:0;font-size:28px;animation:rise linear infinite;opacity:0}
.gr{position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.07) 1px,transparent 1px);background-size:44px 44px;mask:radial-gradient(circle at 50% 50%,#000,transparent 75%);-webkit-mask:radial-gradient(circle at 50% 50%,#000,transparent 75%)}
#lc{position:relative;width:min(400px,92vw);padding:38px 34px;border-radius:26px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.9);box-shadow:0 30px 70px rgba(79,70,229,.18),inset 0 1px 0 #fff;transition:transform .15s;animation:up .7s var(--sp)}
.logo{width:68px;height:68px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#6366f1,#06b6d4);box-shadow:0 12px 26px rgba(99,102,241,.4);animation:bob 3s ease-in-out infinite}
#lc h1{text-align:center;font-size:22px;font-weight:800}#lc p{text-align:center;color:var(--mut);margin:4px 0 24px;font-size:13px}
.fg{position:relative;margin-bottom:14px}.fg span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px}
.fg select,.fg input{width:100%;padding:13px 44px 13px 44px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:none;transition:.25s;appearance:none;-webkit-appearance:none}
.fg select:focus,.fg input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.fg .eye{left:auto;right:12px;cursor:pointer;transition:.2s}.fg .eye:hover{transform:translateY(-50%) scale(1.25)}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 22px rgba(99,102,241,.35);transition:transform .25s var(--sp),box-shadow .25s}
.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 16px 30px rgba(99,102,241,.45)}.btn:active{transform:scale(.96)}
#lc .btn{width:100%;padding:14px;font-size:15px}
/* APP */
#app{display:none;height:100vh;grid-template-columns:262px 1fr}#app.on{display:grid}
#side{background:var(--glass);backdrop-filter:blur(20px);border-right:1px solid var(--line);padding:18px 14px;overflow:auto;transition:transform .35s var(--sp)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}.brand .logo{width:44px;height:44px;font-size:22px;margin:0;border-radius:14px}
.brand b{display:block;font-size:15px;font-weight:800}.brand small{color:var(--mut);font-size:11px}
.grp{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#94a3b8;margin:16px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:14px;margin-bottom:2px;transition:.25s;font-weight:600;color:#475569}
.nav:hover{background:#eef2ff;transform:translateX(5px)}.nav.on{background:linear-gradient(90deg,#e0e7ff,#f5f3ff);color:#4338ca;box-shadow:inset 3px 0 0 #6366f1}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 14px -4px var(--c1);flex:none;transition:.3s var(--sp)}
.ic i{font-style:normal;font-size:17px;display:inline-block;animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
.nav:hover .ic{transform:scale(1.14) rotate(-6deg)}.nav:hover .ic i,.kpi:hover .ic i{animation:wig .6s}
#main{display:flex;flex-direction:column;min-width:0;height:100vh}
#top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
#top h2{font-size:19px;font-weight:800;flex:1;display:flex;align-items:center;gap:10px}
#burger{display:none;background:#eef2ff;border:0;border-radius:12px;padding:8px 11px;font-size:18px}
.usr{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 14px;border-radius:40px;background:#fff;border:1px solid var(--line)}
.usr b{font-size:12.5px;display:block;line-height:1.1}.usr small{color:var(--mut);font-size:10.5px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,#ec4899,#f59e0b)}
.tb{border:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:16px;transition:.25s var(--sp)}.tb:hover{transform:translateY(-2px) rotate(-8deg);box-shadow:0 8px 18px rgba(0,0,0,.08)}
#view{flex:1;overflow:auto;padding:22px 24px 40px}
.pv{animation:up .5s var(--sp)}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:18px}
.card{position:relative;background:var(--glass);backdrop-filter:blur(14px);border:1px solid #fff;border-radius:20px;box-shadow:0 8px 26px rgba(30,41,59,.06);overflow:hidden;transition:.35s var(--sp)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s;pointer-events:none}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(99,102,241,.16)}.card:hover::after{transform:translateX(120%)}
.kpi{padding:18px;display:flex;align-items:center;gap:14px;animation:up .6s var(--sp) backwards}
.kpi .ic{width:54px;height:54px;border-radius:17px}.kpi .ic i{font-size:27px}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1}.kpi small{color:var(--mut);font-weight:600}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.cc{padding:18px}.cc h3{font-size:14px;margin-bottom:12px;display:flex;gap:8px}.cc canvas{max-height:230px}
/* TABLE */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.sr{position:relative;flex:1;min-width:200px}.sr input{width:100%;padding:11px 14px 11px 40px;border-radius:14px;border:1.5px solid var(--line);outline:none;background:#fff;transition:.25s}
.sr input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(99,102,241,.13)}.sr span{position:absolute;left:13px;top:50%;transform:translateY(-50%)}
.ex{display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:14px;border:0;font-weight:700;color:#fff;transition:.3s var(--sp)}
.ex:hover{transform:translateY(-3px) scale(1.05)}.ex:active{transform:scale(.95)}.ex i{font-style:normal;font-size:17px}
.ex.x{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 8px 18px rgba(34,197,94,.35)}
.ex.p{background:linear-gradient(135deg,#dc2626,#f97316);box-shadow:0 8px 18px rgba(239,68,68,.35)}
.ex.t{background:linear-gradient(135deg,#0284c7,#06b6d4);box-shadow:0 8px 18px rgba(6,182,212,.35)}
.tw{overflow:auto;max-height:calc(100vh - 235px)}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th{position:sticky;top:0;background:linear-gradient(#f8faff,#eef2ff);padding:12px 14px;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:#4338ca;cursor:pointer;z-index:2;user-select:none;transition:.2s}
th:hover{background:#e0e7ff}td{padding:11px 14px;border-top:1px solid #eef2f7;max-width:340px;overflow:hidden;text-overflow:ellipsis}
tbody tr{transition:.2s;cursor:pointer;animation:up .4s backwards}tbody tr:hover{background:linear-gradient(90deg,#eef2ff,#faf5ff);box-shadow:inset 4px 0 0 #6366f1}tbody tr:active{transform:scale(.995)}
td.n{text-align:right;font-variant-numeric:tabular-nums}.neg{color:#dc2626;font-weight:700}
.pl{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700}
.g{background:#dcfce7;color:#15803d}.rd{background:#fee2e2;color:#b91c1c}.bl2{background:#dbeafe;color:#1d4ed8}.am{background:#fef3c7;color:#b45309}
.pgw{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;gap:8px;color:var(--mut);font-weight:600}
.pg{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700;margin-left:4px;transition:.2s var(--sp)}.pg:hover:not(:disabled){transform:translateY(-2px);background:#eef2ff}.pg:disabled{opacity:.4;cursor:default}
.emp{text-align:center;padding:60px;color:var(--mut);font-size:16px}
/* OVERLAY */
#ov{position:fixed;inset:0;z-index:70;background:rgba(30,41,59,.4);backdrop-filter:blur(8px);display:none;place-items:center;padding:20px}
#ov.on{display:grid;animation:up .25s}
#md{width:min(720px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:24px;padding:26px;box-shadow:0 40px 80px rgba(0,0,0,.25);animation:up .45s var(--sp)}
#md h3{font-size:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dg div{padding:10px 13px;background:#f8faff;border-radius:13px;border:1px solid #eef2ff;transition:.25s}.dg div:hover{transform:translateY(-3px);background:#eef2ff}
.dg small{display:block;color:var(--mut);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.dg b{font-weight:600;word-break:break-word}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:#1e293b;color:#fff;padding:12px 20px;border-radius:14px;z-index:99;transition:.4s var(--sp);font-weight:600}
#toast.on{transform:translate(-50%,0)}
@media(max-width:860px){#app{grid-template-columns:1fr}#side{position:fixed;z-index:40;height:100vh;width:262px;transform:translateX(-105%);background:#fff}#side.on{transform:none}#burger{display:block}.usr div{display:none}.usr{padding:4px}#view{padding:16px}}
#diag{display:none;margin:0 0 14px;padding:12px 14px;border-radius:14px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:12px;line-height:1.55;text-align:left}#diag.on{display:block}#diag .pg{margin:10px 0 0;color:#991b1b}

/* ===== LIQUID GLASS ===== */
:root{--bg:#d6e3fa;--p:#1e5bb8;--nv:#0f3f8f;--glass:rgba(255,255,255,.42);--gb:rgba(255,255,255,.7);--mut:#5b6b85}
html{background:#cfdcf5}body{background:transparent;height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 60vmax at 6% 0,#7fb0ff99,transparent 60%),radial-gradient(50vmax 50vmax at 100% 18%,#6ee7f78c,transparent 60%),radial-gradient(46vmax 46vmax at 42% 108%,#ff8f9a70,transparent 60%),linear-gradient(160deg,#e8f0fd,#c7d8f4)}
#side,#top,.card,.tb,.usr,.sr input,.pg,#sh .hd{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.25),0 10px 30px rgba(15,63,143,.10)}
#md{background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--gb)}
#app{height:100dvh;padding:10px;gap:10px;grid-template-columns:262px 1fr;transition:grid-template-columns .3s ease}
#side{border-radius:24px;overflow-x:hidden}#top{border-radius:22px;gap:10px;flex-wrap:wrap;padding:10px 16px}
#main{height:calc(100dvh - 20px);gap:10px}#view{padding:2px 4px 24px}
.tw{max-height:calc(100dvh - 250px)}.pv{animation:up .25s ease both}.kpi{animation:none}.card:hover{transform:translateY(-3px)}
.nav:hover{background:rgba(255,255,255,.55);transform:none}
.nav.on{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.4));color:var(--nv);box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(15,63,143,.16)}
th{background:rgba(226,236,255,.9);color:var(--nv)}td{border-top:1px solid rgba(15,63,143,.08)}
tbody tr{animation:none}tbody tr:hover{background:rgba(255,255,255,.65);box-shadow:inset 4px 0 0 var(--p)}
.btn{background:linear-gradient(135deg,#2f7bea,#0f3f8f);box-shadow:0 10px 24px rgba(15,63,143,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.av{background:linear-gradient(135deg,#2f7bea,#c8202f)}.brand{gap:10px}.bi{width:46px;height:38px;object-fit:contain;flex:none}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.tb{display:grid;place-items:center;width:40px;height:40px;padding:0;color:var(--nv);cursor:pointer;text-decoration:none;flex:none}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{transform:translateY(-2px)}.tb.wd{width:auto;grid-auto-flow:column;gap:8px;padding:0 14px;font-weight:700;font-size:13px}
#burger{display:grid;background:var(--glass);border:1px solid var(--gb);padding:0;font-size:inherit}
#rf.sp svg{animation:spin .8s linear infinite}
#clk{text-align:right;line-height:1.2;padding:0 6px}#clk b{display:block;font-size:15px;font-variant-numeric:tabular-nums;color:var(--nv)}#clk small{color:var(--mut);font-size:11px;font-weight:600}
.sk{height:340px;background:linear-gradient(100deg,rgba(255,255,255,.25) 30%,rgba(255,255,255,.75) 50%,rgba(255,255,255,.25) 70%);background-size:200% 100%;animation:shim 1.2s linear infinite}.sk::after{display:none}
#sb{display:none;position:fixed;inset:0;z-index:55;background:rgba(10,30,70,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}#sb.on{display:block}
#sh{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;gap:10px;padding:10px;background:rgba(10,30,70,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}#sh.on{display:flex;animation:up .25s}
#sh .hd{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:18px;color:var(--nv)}#sh .hd b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sh iframe{flex:1;width:100%;border:0;border-radius:18px;background:#fff}
@media(min-width:861px){#app.col{grid-template-columns:78px 1fr}#app.col .brand div,#app.col .nav .t{display:none}#app.col .brand{justify-content:center;padding:4px 0 12px}
#app.col .grp{font-size:0;height:1px;background:rgba(15,63,143,.15);margin:10px 8px}#app.col .nav{justify-content:center;padding:6px}}
/* ===== LOGIN: jaring rangka baja + percikan las ===== */
#login{background:radial-gradient(90vmax 70vmax at 15% 5%,#1650b8,transparent 60%),radial-gradient(70vmax 60vmax at 95% 100%,#7a1626,transparent 55%),#061a44}
#login::before,#login::after{content:"";position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(40px);opacity:.55;animation:drift 16s ease-in-out infinite}
#login::before{left:-18vmax;top:-22vmax;background:radial-gradient(circle,#2f8bff,transparent 65%)}#login::after{right:-20vmax;bottom:-24vmax;background:radial-gradient(circle,#ff5a68,transparent 65%);animation-delay:-8s}
#cv{position:absolute;inset:0;width:100%;height:100%}
#lc{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.3);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);color:#fff;overflow:hidden;animation:cin .9s cubic-bezier(.2,.8,.2,1) backwards}
#lc::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);transform:translateX(-100%);animation:sweep 5s ease-in-out 1.4s infinite;pointer-events:none}
#lc>*{animation:rv .7s cubic-bezier(.2,.8,.2,1) both}#lc>:nth-child(1){animation-delay:0.39s}#lc>:nth-child(2){animation-delay:0.48s}#lc>:nth-child(3){animation-delay:0.57s}#lc>:nth-child(4){animation-delay:0.66s}#lc>:nth-child(5){animation-delay:0.75s}#lc>:nth-child(6){animation-delay:0.84s}#lc>:nth-child(7){animation-delay:0.93s}
#lc h1{color:#fff}#lc p{color:#c9d8f5}.lp{background:#fff;border-radius:18px;padding:12px 16px;margin:0 auto 18px;width:max-content;max-width:100%;box-shadow:0 10px 30px rgba(0,0,0,.28)}.lp img{display:block;height:42px;width:auto;max-width:100%}
.fg select,.fg input{color:#1e293b}
@keyframes cin{from{opacity:0;transform:scale(.94) translateY(30px)}}@keyframes rv{from{opacity:0;transform:translateY(14px);filter:blur(8px)}}@keyframes sweep{to{transform:translateX(100%)}}
/* ===== PONSEL ===== */

const HELP='Periksa: (1) Deploy Web App → "Who has access" = Anyone, (2) setelah edit kode sudah Deploy > Manage deployments > New version, (3) URL /exec di API_URL benar, (4) setup() sudah dijalankan sekali & otorisasi diizinkan, (5) halaman tidak dibuka dari pratinjau/iframe yang memblokir koneksi eksternal.';
async function api(action,x){
 if(API_URL.indexOf('GANTI')===0)throw new Error('URL Web App belum diisi pada variabel API_URL');
 const body=JSON.stringify(Object.assign({action,token:S.token},x||{}));let last;
 for(let i=0;i<3;i++){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),40000);
  try{
   const r=await fetch(API_URL,{method:'POST',redirect:'follow',credentials:'omit',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:c.signal});
   const tx=await r.text();clearTimeout(t);let j;
   try{j=JSON.parse(tx)}catch(_){throw new SrvErr('Server membalas bukan JSON (HTTP '+r.status+'). Biasanya akses Web App belum "Anyone" atau otorisasi script belum diberikan.')}
   if(j.auth===false){logout(true);throw new SrvErr(j.msg)}if(!j.ok)throw new SrvErr(j.msg||'Gagal');return j
  }catch(e){clearTimeout(t);if(e instanceof SrvErr)throw e;last=e;if(i<2)await wait(1200*(i+1))}
 }
 const err=new Error(last&&last.name==='AbortError'?'Server tidak merespons (timeout 40 detik). Coba lagi.':'Gagal terhubung ke server. '+(location.protocol==='file:'?'Halaman dibuka dari file lokal — buka lewat hosting HTTPS. ':'')+HELP);
 err.net=1;throw err}

/* login fx: jaring rangka baja + percikan las */
(function(){const cv=$('#cv'),x=cv.getContext('2d'),L=$('#login'),lc=$('#lc');let W,H,D,N=[],P=[],m={x:-999,y:-999},run=0;
const rs=()=>{D=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*D;H=cv.height=innerHeight*D;N=Array.from({length:Math.round(Math.min(70,innerWidth*innerHeight/15000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35*D,vy:(Math.random()-.5)*.35*D}))};
const spark=(px,py)=>{for(let i=0;i<28;i++){const a=Math.random()*6.283,v=(1+Math.random()*4)*D;P.push({x:px*D,y:py*D,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2*D,l:1})}};
function f(){if(L.style.display==='none'){run=0;return}x.clearRect(0,0,W,H);const R=150*D;
 for(const a of N){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;const dx=m.x*D-a.x,dy=m.y*D-a.y;if(Math.hypot(dx,dy)<R*1.3){a.x+=dx*.012;a.y+=dy*.012}}
 for(let i=0;i<N.length;i++){const a=N[i];for(let j=i+1;j<N.length;j++){const b=N[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<R){x.strokeStyle=`rgba(150,200,255,${(1-d/R)*.45})`;x.lineWidth=D;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
  const nr=Math.hypot(m.x*D-a.x,m.y*D-a.y)<R;x.fillStyle=nr?'#ffb347':'rgba(190,220,255,.85)';x.beginPath();x.arc(a.x,a.y,(nr?3.2:2)*D,0,6.283);x.fill()}
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12*D;p.l-=.022;if(p.l<=0){P.splice(i,1);continue}x.strokeStyle=`rgba(255,${150+p.l*90|0},60,${p.l})`;x.lineWidth=2*D*p.l;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-p.vx*2,p.y-p.vy*2);x.stroke()}
